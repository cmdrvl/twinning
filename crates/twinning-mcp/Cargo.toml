[package]
name = "twinning-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
license-file = "../../LICENSE"
publish = false

[[bin]]
name = "twinning-mcp"
path = "src/main.rs"

[[bin]]
name = "fake_twinning"
path = "tests/bin/fake_twinning.rs"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
thiserror = "2"
twinning-mcp-core = { path = "../twinning-mcp-core" }

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
